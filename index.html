<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee3d3"><title>A Tiny Mystery</title>
<style>
:root{--paper:#eee3d3;--ink:#191815;--red:#c96d62;--blue:#4d7194;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif;color:var(--ink)}body{background:#111;display:grid;place-items:center;padding:8px}
.phone{width:min(100%,430px);height:min(900px,97dvh);min-height:590px;background:var(--paper);border:7px solid #080808;border-radius:38px;overflow:hidden;position:relative;box-shadow:0 18px 55px #0008}
.phone:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.32;background:radial-gradient(ellipse at 12% 8%,#fff 0,transparent 38%),radial-gradient(ellipse at 95% 90%,#c8b7a0 0,transparent 42%)}
.status{height:29px;padding:7px 18px 0;font-size:11px;display:flex;justify-content:space-between;position:relative;z-index:1}
.stage{height:calc(100% - 29px);display:none;position:relative;overflow:hidden;align-items:center;justify-content:center;flex-direction:column;padding:22px}
.stage.active{display:flex;animation:fade .3s ease}@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.big-click{z-index:1;position:relative;background:transparent;border:0;font-size:clamp(54px,14vw,70px);line-height:.98;letter-spacing:-2px;padding:20px;transform:rotate(-4deg)}
.big-click:after{content:"";position:absolute;inset:8px -2px;border:2px solid var(--red);border-radius:50%;transform:rotate(7deg);pointer-events:none}
.heart{z-index:1;color:var(--ink);font-size:30px;margin-top:5px}.hint{z-index:1;opacity:.48;font-size:12px;margin-top:23px}
.corner{position:absolute;z-index:3;width:126px;min-height:72px;background:transparent;border:0;padding:7px 5px;font-size:15px;line-height:1.15;text-align:center}
.corner:before{content:"↘";display:block;font-size:30px;line-height:1.1}.tl{top:32px;left:3px;transform:rotate(-7deg)}.tr{top:32px;right:3px;transform:rotate(7deg)}.bl{bottom:25px;left:3px;transform:rotate(6deg)}.br{bottom:25px;right:3px;transform:rotate(-7deg)}.tr:before,.br:before{content:"↙"}
.corner.done{opacity:.35;text-decoration:line-through}.corner.next{background:#c96d6220;border-bottom:3px solid var(--red);border-radius:10px;animation:flash .7s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.45;filter:brightness(1.2)}}
.center-tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88px;height:88px;border:0;border-radius:50%;background:transparent;z-index:2;font-size:0}
.center-tap:after{content:"☺";font-size:31px;display:block}
.center-tap.ready{animation:flash .7s ease-in-out infinite;outline:2px dashed var(--red);outline-offset:4px}
.gift-wrap{z-index:1;display:flex;align-items:center;justify-content:center;flex:1;width:100%;min-height:220px}
.gift-button{background:transparent;border:0;position:relative;padding:10px;animation:bob 2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.gift{display:block;width:170px;height:130px;position:relative;background:#d9c4a7;border:3px solid #332c25;border-radius:5px;box-shadow:7px 9px 0 #c2ac90}
.gift:before{content:"";position:absolute;left:62px;top:0;width:29px;height:100%;background:var(--red);border-left:2px solid #332c25;border-right:2px solid #332c25}
.gift:after{content:"";position:absolute;left:-8px;top:-20px;width:178px;height:33px;background:#ead9c0;border:3px solid #332c25;border-radius:5px}
.ribbon{position:absolute;z-index:2;top:-44px;left:51px;width:50px;height:38px;border:6px solid var(--red);border-radius:50% 50% 8% 50%;transform:rotate(20deg)}.ribbon:after{content:"";position:absolute;left:22px;top:-2px;width:48px;height:37px;border:6px solid var(--red);border-radius:50% 50% 50% 8%;transform:rotate(-45deg)}
.present-label{z-index:1;margin-top:20px;font-size:16px;opacity:.8}
.reveal{display:none;z-index:2;position:absolute;inset:0;text-align:center;background:var(--paper);overflow:hidden;animation:pop .55s cubic-bezier(.2,1.4,.5,1)}.reveal.show{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 14px 12px}
@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
.birthday{font-size:clamp(33px,9vw,45px);line-height:1.02;letter-spacing:-1.4px;margin:12px 0 4px;transform:rotate(-2deg);z-index:2}.birthday span{color:var(--red)}
.art{width:min(100%,330px);height: min(64%,520px);object-fit:cover;object-position:center 38%;border:2px solid #29231f;border-radius:10px;box-shadow:5px 6px 0 #d2c2ae;z-index:1}
.subtitle{z-index:2;font-size:14px;line-height:1.35;margin:8px auto 0;max-width:290px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}.confetti i{position:absolute;top:-20px;width:7px;height:13px;background:var(--red);border-radius:2px;animation:fall 2.6s linear infinite}.confetti i:nth-child(3n){background:var(--blue)}.confetti i:nth-child(3n+1){background:#c5a66f}@keyframes fall{to{transform:translateY(900px) rotate(650deg);opacity:.1}}
@media(max-height:700px){.corner{font-size:13px;width:112px}.tl,.tr{top:22px}.bl,.br{bottom:17px}.art{height:56%}.birthday{font-size:34px;margin-top:6px}.subtitle{font-size:12px}}
</style></head><body><main class="phone" aria-label="A tiny mystery"><div class="status"><span>9:41</span><span>● ● ▰</span></div>

<button class="corner tl" data-corner="0">No click here...</button><button class="corner tr" data-corner="1">no click here...</button><button class="corner bl" data-corner="2">No No click here...</button><button class="corner br" data-corner="3">No no no click here...</button>
<button class="center-tap" id="centerTap" aria-label="Tap the middle after the four corners"></button>
</section>

<script>
const stages=[...document.querySelectorAll('.stage')];function show(id){stages.forEach(s=>s.classList.toggle('active',s.id===id));}
document.getElementById('start').addEventListener('click',()=>show('game'));
let nextCorner=0;const corners=[...document.querySelectorAll('[data-corner]')];const center=document.getElementById('centerTap');
function guide(){corners.forEach((b,i)=>b.classList.toggle('next',i===nextCorner&&nextCorner<4));center.classList.toggle('ready',nextCorner===4);}
corners.forEach((btn,i)=>btn.addEventListener('click',()=>{if(i!==nextCorner){btn.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:220});return;}btn.classList.remove('next');btn.classList.add('done');nextCorner++;guide();}));
center.addEventListener('click',()=>{if(nextCorner===4)show('presentStage');else center.animate([{opacity:1},{opacity:.45},{opacity:1}],{duration:220});});
document.getElementById('openGift').addEventListener('click',()=>{document.getElementById('giftWrap').style.display='none';document.getElementById('presentLabel').style.display='none';document.getElementById('reveal').classList.add('show');const confetti=document.getElementById('confetti');for(let i=0;i<42;i++){const bit=document.createElement('i');bit.style.left=Math.random()*100+'%';bit.style.animationDelay=Math.random()*1.8+'s';bit.style.animationDuration=(1.8+Math.random()*1.8)+'s';confetti.appendChild(bit);}});
</script></body></html>
