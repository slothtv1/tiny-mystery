<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eee3d3">
<title>A Tiny Mystery</title>
<style>
:root{--paper:#eee3d3;--ink:#191815;--pink:#ed7b82;--red:#b94c50}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",ui-rounded,system-ui,sans-serif;color:var(--ink)}
body{background:#111;display:grid;place-items:center;padding:8px}
.phone{width:min(100%,430px);height:min(900px,97dvh);min-height:590px;background:var(--paper);border:7px solid #080808;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 18px 55px #0008}
.phone:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;background:radial-gradient(ellipse at 12% 8%,#fff 0,transparent 38%),radial-gradient(ellipse at 95% 90%,#c8b7a0 0,transparent 42%);z-index:1}
.notch{position:absolute;z-index:10;top:0;left:50%;transform:translateX(-50%);width:42%;height:34px;background:#050505;border-radius:0 0 22px 22px}
.stage{height:100%;width:100%;display:none;position:relative;overflow:hidden;align-items:center;justify-content:center;flex-direction:column;padding:22px}
.stage.active{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.leaf-shadow{position:absolute;inset:0;opacity:.26;pointer-events:none;background:radial-gradient(ellipse at 4% 18%,#89916c55,transparent 28%),radial-gradient(ellipse at 14% 58%,#8a936c66,transparent 25%),radial-gradient(ellipse at 88% 88%,#bba78d66,transparent 35%)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.big-click{z-index:2;position:relative;background:transparent;border:0;font-size:clamp(56px,15vw,72px);line-height:.98;letter-spacing:-2px;padding:20px;transform:rotate(-4deg)}
.big-click:before{content:"";position:absolute;inset:0;pointer-events:none;background:transparent}
.doodles{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:280px;height:280px;pointer-events:none;z-index:2}
.doodles i{position:absolute;width:25px;height:3px;background:var(--ink);border-radius:5px}
.doodles i:nth-child(1){top:48px;left:13px;transform:rotate(42deg)}.doodles i:nth-child(2){top:42px;right:12px;transform:rotate(-48deg)}.doodles i:nth-child(3){top:122px;left:5px;transform:rotate(-15deg)}.doodles i:nth-child(4){top:117px;right:0;transform:rotate(14deg)}.doodles i:nth-child(5){bottom:55px;left:30px;transform:rotate(-50deg)}.doodles i:nth-child(6){bottom:55px;right:20px;transform:rotate(40deg)}
.heart{z-index:2;font-size:38px;margin-top:6px;background:transparent;border:0}
.corner{position:absolute;z-index:4;width:126px;min-height:76px;background:transparent;border:0;padding:7px 5px;font-size:15px;line-height:1.15;text-align:center;opacity:0;visibility:hidden;transition:opacity .22s ease;white-space:normal}
.corner.visible{opacity:1;visibility:visible}
.corner:before{content:"↘";display:block;font-size:30px;line-height:1.1}
.tl{top:48px;left:3px;transform:rotate(-7deg)}.tr{top:48px;right:3px;transform:rotate(7deg)}.bl{bottom:28px;left:3px;transform:rotate(6deg)}.br{bottom:28px;right:3px;transform:rotate(-7deg)}
.tr:before,.br:before{content:"↙"}
.corner.done{opacity:.35;visibility:visible;text-decoration:line-through}
.corner.next{background:#c96d6220;border-bottom:3px solid var(--pink);border-radius:10px;animation:flash .7s ease-in-out infinite}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
.center-smile{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;width:90px;height:90px;background:transparent;border:0;border-radius:50%;font-size:38px}
.center-smile.visible{display:block;animation:smileIn .4s ease-out}
@keyframes smileIn{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.gift-button{background:transparent;border:0;position:relative;z-index:2;animation:bob 2s ease-in-out infinite;padding:24px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.gift{display:block;width:180px;height:140px;position:relative;background:#d9c4a7;border:3px solid #332c25;border-radius:5px;box-shadow:7px 9px 0 #c2ac90}
.gift:before{content:"";position:absolute;left:69px;top:0;width:32px;height:100%;background:var(--red);border-left:2px solid #332c25;border-right:2px solid #332c25}
.gift:after{content:"";position:absolute;left:-8px;top:-20px;width:188px;height:34px;background:#ead9c0;border:3px solid #332c25;border-radius:5px}
.ribbon{position:absolute;z-index:2;top:-5px;left:67px;width:50px;height:38px;border:6px solid var(--red);border-radius:50% 50% 8% 50%;transform:rotate(20deg)}
.ribbon:after{content:"";position:absolute;left:22px;top:-2px;width:48px;height:37px;border:6px solid var(--red);border-radius:50% 50% 50% 8%;transform:rotate(-45deg)}
.present-label{z-index:2;margin-top:15px;font-size:16px;opacity:.8}
.reveal{display:none;position:absolute;inset:0;z-index:5;text-align:center;background:#f4d8b5;overflow:hidden}
.reveal.show{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;padding:0;animation:pop .55s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
.birthday{font-size:clamp(35px,9.2vw,46px);line-height:1.02;letter-spacing:-1.4px;margin:14px 0 8px;transform:rotate(-3deg);z-index:2;font-weight:500}
.birthday span{color:#191815;position:relative;display:inline-block}
.birthday span:after{content:"";position:absolute;left:2%;right:-4%;bottom:-5px;height:5px;background:var(--pink);border-radius:50%;transform:rotate(-5deg)}
.art{width:100%;height:100%;object-fit:fill;object-position:center;z-index:1;display:block}.art.exact-sketch{width:100%;height:100%;object-fit:fill;border:0;border-radius:0}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}.confetti i{position:absolute;top:-20px;width:7px;height:13px;background:var(--pink);border-radius:2px;animation:fall 2.6s linear infinite}.confetti i:nth-child(3n){background:#4d7194}.confetti i:nth-child(3n+1){background:#c5a66f}
@keyframes fall{to{transform:translateY(950px) rotate(650deg);opacity:.1}}
@media(max-height:700px){.corner{font-size:13px;width:112px}.tl,.tr{top:40px}.bl,.br{bottom:20px}}
</style>
</head>
<body>
<main class="phone" aria-label="A tiny mystery birthday website">
<div class="notch" aria-hidden="true"></div>
<section class="stage active" id="intro">
<div class="leaf-shadow"></div><div class="doodles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<button class="big-click" id="start">Click<br>Me...</button><div class="heart">♡</div>
</section>
<section class="stage" id="game">
<div class="leaf-shadow"></div>
<button class="corner tl" data-corner="0">No click here...</button>
<button class="corner tr" data-corner="1">no click here...</button>
<button class="corner bl" data-corner="2">No No click here...</button>
<button class="corner br" data-corner="3">No no no click here...</button>
<button class="center-smile" id="centerSmile" aria-label="Continue">☺</button>
</section>
<section class="stage" id="presentStage">
<div class="leaf-shadow"></div>
<button class="gift-button" id="openGift" aria-label="Open the present"><span class="ribbon"></span><span class="gift"></span></button>
<div class="present-label">Click the present</div>
<div class="reveal" id="reveal">
<div class="confetti" id="confetti"></div>

<script>
const stages=[...document.querySelectorAll('.stage')];
function show(id){stages.forEach(s=>s.classList.toggle('active',s.id===id));}
document.getElementById('start').addEventListener('click',()=>{
  nextCorner=0; corners.forEach(b=>b.classList.remove('done','visible','next')); centerSmile.classList.remove('visible'); guide(); show('game');
});
let nextCorner=0;
const corners=[...document.querySelectorAll('[data-corner]')];
const centerSmile=document.getElementById('centerSmile');
function guide(){
  corners.forEach((b,i)=>{
    b.classList.toggle('visible',b.classList.contains('done') || i===nextCorner);
    b.classList.toggle('next',i===nextCorner);
  });
  if(nextCorner===4){
    corners.forEach(b=>b.classList.remove('next'));
    centerSmile.classList.add('visible');
  }else{
    centerSmile.classList.remove('visible');
  }
}
corners.forEach((btn,i)=>btn.addEventListener('click',()=>{
  if(i!==nextCorner){
    btn.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:220});
    return;
  }
  btn.classList.remove('next');btn.classList.add('done');nextCorner++;guide();
}));
centerSmile.addEventListener('click',()=>show('presentStage'));
document.getElementById('openGift').addEventListener('click',()=>{
  document.getElementById('reveal').classList.add('show');
  const confetti=document.getElementById('confetti');
  if(!confetti.dataset.created){
    for(let i=0;i<42;i++){
      const bit=document.createElement('i');
      bit.style.left=Math.random()*100+'%';
      bit.style.animationDelay=Math.random()*1.8+'s';
      bit.style.animationDuration=(1.8+Math.random()*1.8)+'s';
      confetti.appendChild(bit);
    }
    confetti.dataset.created='yes';
  }
});
</script>
